; ============================================================
;  Mond - Layout
;  Tata letak 4 skin Mond untuk layar 1366x768 ke atas
;  Impor lewat Rainmeter: Manage > Layouts > Import
; ============================================================

[Rainmeter]
Update=1000

; ---------- Jam analog: pojok kanan atas ----------
[MondClock]
Active=1
WindowX=(#SCREENAREAWIDTH# - 200)
WindowY=24

; ---------- Jam digital: kiri atas ----------
[MondDigitalClock]
Active=1
WindowX=24
WindowY=24

; ---------- Sistem: kiri bawah ----------
[MondSystem]
Active=1
WindowX=24
WindowY=(#SCREENAREAHEIGHT# - 190)

; ---------- Cuaca: kanan bawah ----------
[MondWeather]
Active=1
WindowX=(#SCREENAREAWIDTH# - 280)
WindowY=(#SCREENAREAHEIGHT# - 150)
