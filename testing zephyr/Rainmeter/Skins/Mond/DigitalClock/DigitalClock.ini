; ============================================================
;  Mond - Digital Clock
;  Jam digital + tanggal, gaya panel putih Mond
; ============================================================

[Rainmeter]
Update=1000
AccurateText=1
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=Mond\DigitalClock
Author=Mond
Information=Jam digital dan tanggal
Version=1.0.0

[Variables]
PanelColor=255,255,255,235
TextColor=20,20,20,255
SubColor=120,120,120,255
FontFace=Segoe UI
Pad=18

; ---------- Panel ----------
[Panel]
Meter=Shape
Shape=Rectangle 0,0,250,110,16 | Fill Color #PanelColor# | StrokeWidth 0
AntiAlias=1

; ---------- Ukuran ----------
[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureSecs]
Measure=Time
Format=%S

[MeasureDate]
Measure=Time
Format=%A, %d %B %Y
Substitute="Monday":"Senin","Tuesday":"Selasa","Wednesday":"Rabu","Thursday":"Kamis","Friday":"Jumat","Saturday":"Sabtu","Sunday":"Minggu","January":"Januari","February":"Februari","March":"Maret","April":"April","May":"Mei","June":"Juni","July":"Juli","August":"Agustus","September":"September","October":"Oktober","November":"November","December":"Desember"

; ---------- Tampilan ----------
[TimeText]
Meter=String
MeasureName=MeasureTime
X=(#Pad#)
Y=(#Pad#-4)
FontFace=#FontFace#
FontSize=40
FontColor=#TextColor#
FontWeight=300
AntiAlias=1
StringAlign=Left

[SecsText]
Meter=String
MeasureName=MeasureSecs
X=8R
Y=24
FontFace=#FontFace#
FontSize=16
FontColor=#SubColor#
AntiAlias=1
StringAlign=Left

[DateText]
Meter=String
MeasureName=MeasureDate
X=(#Pad#)
Y=8R
FontFace=#FontFace#
FontSize=12
FontColor=#SubColor#
AntiAlias=1
StringAlign=Left
