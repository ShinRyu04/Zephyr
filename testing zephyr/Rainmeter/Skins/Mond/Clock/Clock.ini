; ============================================================
;  Mond - Analog Clock
;  Skin Rainmeter: jam analog dengan jam, menit, detik
; ============================================================

[Rainmeter]
Update=1000
AccurateText=1
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=Mond\Clock
Author=Mond
Information=Jam analog Mond
Version=1.0.0

; ---------- Variabel ----------
[Variables]
Size=160
FaceColor=255,255,255,235
RimColor=20,20,20,255
HourColor=20,20,20,255
MinColor=20,20,20,255
SecColor=227,60,60,255

; ---------- Latar ----------
[Background]
Meter=Shape
Shape=Ellipse (#Size#/2),(#Size#/2),(#Size#/2-8) | Fill Color #FaceColor# | StrokeWidth 3 | Stroke Color #RimColor#
AntiAlias=1

; ---------- Jam ----------
[HourHand]
Meter=Roundline
X=0
Y=0
W=#Size#
H=#Size#
StartAngle=(Rad(270))
RotationAngle=(Rad(30))
LineStart=0
LineLength=(#Size#/2-46)
LineWidth=5
LineColor=#HourColor#
Solid=1
AntiAlias=1
MeasureName=MeasureHour

; ---------- Menit ----------
[MinuteHand]
Meter=Roundline
X=0
Y=0
W=#Size#
H=#Size#
StartAngle=(Rad(270))
RotationAngle=(Rad(6))
LineStart=0
LineLength=(#Size#/2-28)
LineWidth=3
LineColor=#MinColor#
Solid=1
AntiAlias=1
MeasureName=MeasureMinute

; ---------- Detik ----------
[SecondHand]
Meter=Roundline
X=0
Y=0
W=#Size#
H=#Size#
StartAngle=(Rad(270))
RotationAngle=(Rad(6))
LineStart=0
LineLength=(#Size#/2-18)
LineWidth=1
LineColor=#SecColor#
Solid=1
AntiAlias=1
MeasureName=MeasureSecond

; ---------- Titik tengah ----------
[CenterDot]
Meter=Shape
Shape=Ellipse (#Size#/2),(#Size#/2),4 | Fill Color #SecColor# | StrokeWidth 0
AntiAlias=1

; ---------- Ukuran Time ----------
[MeasureTime]
Measure=Time
Format=%H:%M:%S

[MeasureHour]
Measure=Time
Format=%#H

[MeasureMinute]
Measure=Time
Format=%M

[MeasureSecond]
Measure=Time
Format=%S
