; ============================================================
;  Mond - System
;  CPU, RAM, dan disk dalam gaya bar Mond
; ============================================================

[Rainmeter]
Update=1000
AccurateText=1
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=Mond\System
Author=Mond
Information=Monitor CPU, RAM, dan disk
Version=1.0.0

[Variables]
PanelColor=255,255,255,235
TextColor=30,30,30,255
SubColor=130,130,130,255
BarBack=225,225,225,255
BarFill=52,199,89,255
BarWarn=255,159,10,255
BarCrit=227,60,60,255
FontFace=Segoe UI
Pad=16
BarWidth=218

; ---------- Panel ----------
[Panel]
Meter=Shape
Shape=Rectangle 0,0,250,150,16 | Fill Color #PanelColor# | StrokeWidth 0
AntiAlias=1

; ---------- Ukuran ----------
[MeasureCPU]
Measure=CPU

[MeasureRAM]
Measure=PhysicalMemory
InvertMeasure=1

[MeasureDisk]
Measure=FreeDiskSpace
Drive=C:
InvertMeasure=1

; ---------- Label ----------
[LabelCPU]
Meter=String
Text=CPU
X=(#Pad#)
Y=(#Pad#)
FontFace=#FontFace#
FontSize=11
FontColor=#SubColor#
AntiAlias=1
DynamicVariables=1

[ValueCPU]
Meter=String
MeasureName=MeasureCPU
X=(250-#Pad#)
Y=0r
FontFace=#FontFace#
FontSize=11
FontColor=#TextColor#
StringAlign=Right
AutoScale=1
NumOfDecimals=0
Text=%1%
AntiAlias=1

[BarCPU]
Meter=Bar
MeasureName=MeasureCPU
X=(#Pad#)
Y=6R
W=#BarWidth#
H=4
BarColor=#BarFill#
SolidColor=#BarBack#
BarOrientation=Horizontal
AntiAlias=1

[LabelRAM]
Meter=String
Text=RAM
X=(#Pad#)
Y=14R
FontFace=#FontFace#
FontSize=11
FontColor=#SubColor#
AntiAlias=1

[ValueRAM]
Meter=String
MeasureName=MeasureRAM
X=(250-#Pad#)
Y=0r
FontFace=#FontFace#
FontSize=11
FontColor=#TextColor#
StringAlign=Right
NumOfDecimals=0
Text=%1%
AntiAlias=1

[BarRAM]
Meter=Bar
MeasureName=MeasureRAM
X=(#Pad#)
Y=6R
W=#BarWidth#
H=4
BarColor=#BarFill#
SolidColor=#BarBack#
BarOrientation=Horizontal
AntiAlias=1

[LabelDisk]
Meter=String
Text=Disk C:
X=(#Pad#)
Y=14R
FontFace=#FontFace#
FontSize=11
FontColor=#SubColor#
AntiAlias=1

[ValueDisk]
Meter=String
MeasureName=MeasureDisk
X=(250-#Pad#)
Y=0r
FontFace=#FontFace#
FontSize=11
FontColor=#TextColor#
StringAlign=Right
NumOfDecimals=0
Text=%1%
AntiAlias=1

[BarDisk]
Meter=Bar
MeasureName=MeasureDisk
X=(#Pad#)
Y=6R
W=#BarWidth#
H=4
BarColor=#BarFill#
SolidColor=#BarBack#
BarOrientation=Horizontal
AntiAlias=1
