; ============================================================
;  Mond - Weather
;  Cuaca lewat Open-Meteo (gratis, tanpa API key)
;  Ubah Latitude/Longitude di [Variables] sesuai kota kamu
; ============================================================

[Rainmeter]
Update=600000
AccurateText=1
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=Mond\Weather
Author=Mond
Information=Cuaca harian via Open-Meteo
Version=1.0.0

[Variables]
PanelColor=255,255,255,235
TextColor=30,30,30,255
SubColor=130,130,130,255
FontFace=Segoe UI
Pad=16
Latitude=-6.2088
Longitude=106.8456
City=Jakarta
Unit=celsius

; ---------- Panel ----------
[Panel]
Meter=Shape
Shape=Rectangle 0,0,250,120,16 | Fill Color #PanelColor# | StrokeWidth 0
AntiAlias=1

; ---------- Ambil data ----------
[MeasureWeather]
Measure=WebParser
URL=https://api.open-meteo.com/v1/forecast?latitude=#Latitude#&longitude=#Longitude#&current=temperature_2m,weather_code&timezone=auto
UpdateRate=600
RegExp=(?siU)"current":.*"temperature_2m":([-\d.]+).*"weather_code":(\d+)
FinishAction=[!UpdateMeter *][!Redraw]

[MeasureTemp]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=1

[MeasureCode]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=2
Substitute="0":"Cerah","1":"Cerah berawan","2":"Berawan","3":"Mendung","45":"Berkabut","48":"Kabut beku","51":"Gerimis ringan","53":"Gerimis","55":"Gerimis lebat","61":"Hujan ringan","63":"Hujan","65":"Hujan lebat","71":"Salju ringan","73":"Salju","75":"Salju lebat","80":"Hujan lokal","81":"Hujan lokal lebat","82":"Hujan sangat lebat","95":"Badai petir","96":"Badai + hujan es","99":"Badai hebat"

; ---------- Tampilan ----------
[CityText]
Meter=String
Text=#City#
X=(#Pad#)
Y=(#Pad#)
FontFace=#FontFace#
FontSize=11
FontColor=#SubColor#
AntiAlias=1

[TempText]
Meter=String
MeasureName=MeasureTemp
X=(#Pad#)
Y=2R
FontFace=#FontFace#
FontSize=36
FontColor=#TextColor#
FontWeight=300
Text=%1°
AntiAlias=1

[CondText]
Meter=String
MeasureName=MeasureCode
X=(#Pad#)
Y=2R
FontFace=#FontFace#
FontSize=12
FontColor=#SubColor#
AntiAlias=1
