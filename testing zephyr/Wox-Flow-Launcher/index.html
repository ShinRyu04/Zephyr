<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
  <title>Zeph Launcher</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="launcher" id="launcher">
    <div class="field">
      <svg class="icon-search" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5" />
        <path d="M16 16l4.5 4.5" />
      </svg>
      <input
        id="q"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="Cari aplikasi..." />
      <kbd class="hint">Esc</kbd>
    </div>
    <ul class="results" id="results" hidden></ul>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
