name: build-linux

on:
  push:
    tags:
      - 'v*'
  # Rilis Linux juga bisa dipicu tanpa tag baru (mis. build ulang 1.1.12).
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Upload hasil ke release tag ini (kosongkan untuk artifact saja)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    # The last step attaches the Linux bundles to the release, and the default
    # GITHUB_TOKEN is read-only for contents. Without this the upload step ends
    # with "HTTP 403: Resource not accessible by integration" while the build
    # itself succeeded.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: linux-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Build (debug check dulu - pastikan kode kompilasi di Linux)
        run: |
          cd src-tauri
          cargo check --all-targets 2>&1 | tail -30

      - name: Build release bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@^2 build --bundles deb appimage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/zephyr
          if-no-files-found: error

      # Artefak Linux ditempelkan ke release yang sama dengan installer Windows,
      # jadi satu release memuat 4 berkas + 4 signature seperti 1.1.11.
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release upload "$TAG" \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/deb/*.deb.sig \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/appimage/*.AppImage.sig \
            --clobber