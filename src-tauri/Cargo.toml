[package]
name = "zephyr"
version = "1.1.2"
description = "Zephyr - Code editor desktop pribadi"
authors = ["Zephyr"]
edition = "2021"

[lib]
name = "zephyr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2.7.3"
sysinfo = "0.39.6"
encoding_rs = "0.8.35"
thiserror = "2.0.20"
notify = "8.2.0"
regex = "1.13.1"
globset = "0.4.20"
tauri-plugin-clipboard-manager = "2"
which = "8"
blake3 = "1.8.7"
base64 = "0.23.1"
ureq = { version = "3", features = ["json"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
# Auto-update dalam app (fase 17.6). Endpoint masih kosong — plugin tetap
# dipasang supaya UI "Check for Updates" punya jalur nyata; kalau endpoints
# kosong, `check()` mengembalikan error yang ditangkap dan ditampilkan sebagai
# "Update belum dikonfigurasi" (17.6.e).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# fase 28: instance kedua meneruskan argv ke jendela pertama (ala `code`).
# WAJIB plugin PERTAMA yang didaftarkan — plugin jalan sesuai urutan
# penambahan, dan pengecekan instance harus terjadi sebelum apa pun dimulai.
tauri-plugin-single-instance = "2"
# Logging (fase 14): tracing + penulis file sendiri (rotate 2MB) di logging.rs.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
# Hanya untuk stempel waktu lokal di log & nama file harian.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
zip = { version = "5", default-features = false, features = ["deflate"] }

[features]
# Fitur custom-protocol hanya aktif saat build release (production).
custom-protocol = ["tauri/custom-protocol"]
