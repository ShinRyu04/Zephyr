[package]
name = "zephyr"
version = "0.5.0"
description = "Zephyr - Code editor desktop pribadi"
authors = ["Zephyr"]
edition = "2021"

[lib]
name = "zephyr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
tauri-plugin-dialog = "2.7.3"
sysinfo = "0.39.6"
encoding_rs = "0.8.35"
thiserror = "2.0.20"
notify = "8.2.0"
regex = "1.13.1"
globset = "0.4.20"
tauri-plugin-clipboard-manager = "2"
which = "8"

[features]
# Fitur custom-protocol hanya aktif saat build release (production).
custom-protocol = ["tauri/custom-protocol"]
