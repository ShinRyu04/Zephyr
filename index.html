<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/zephyr.svg" />
    <title>Zephyr — Code Editor</title>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0f1115;
        color: #c9d1d9;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        z-index: 2147483647;
      }
      #boot-splash .bs-logo {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 4px;
        color: #4aa3ff;
      }
      #boot-splash .bs-bar {
        width: 180px;
        height: 3px;
        border-radius: 2px;
        background: #23272e;
        overflow: hidden;
      }
      #boot-splash .bs-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #4aa3ff;
        animation: bs-slide 1.1s ease-in-out infinite;
      }
      #boot-splash .bs-note {
        font-size: 12px;
        opacity: 0.55;
      }
      @keyframes bs-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
      html[data-zephyr-ready] #boot-splash { display: none; }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <div class="bs-logo">ZEPHYR</div>
      <div class="bs-bar"></div>
      <div class="bs-note">Menyiapkan editor…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
